spring.application.name=bandsyncapi
spring.config.import=optional:file:.env[.properties]

# Database
spring.jpa.hibernate.ddl-auto=none
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.show-sql: false

#JWT secret key
secret.key.jwt=${SECRET_KEY_JWT}

# AWS
aws.access.key=${AWS_ACCESS_KEY_ID}
aws.secret.key=${AWS_SECRET_ACCESS_KEY}
aws.region=${AWS_REGION}
aws.bucket.name=${AWS_BUCKET_NAME}
aws.bucket.users.directory=${AWS_BUCKET_USERS_DIRECTORY}
aws.bucket.logos.directory=${AWS_BUCKET_LOGOS_DIRECTORY}
aws.bucket.songs.directory=${AWS_BUCKET_SONGS_DIRECTORY}

# Multipart configuration
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Email configuration
spring.mail.host=${MAIL_HOST}
spring.mail.port=${MAIL_PORT}
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=${MAIL_AUTH}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_STARTTLS_ENABLE}

# Fronted
fronted.url=${WEB_SITE_URL}
fronted.musicalband.path=${WEB_SITE_MUSICALBANDS_PATH}