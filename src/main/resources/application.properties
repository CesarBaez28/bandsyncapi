app.email=${APP_EMAIL}
server.port=${PORT}

spring.application.name=${APP_NAME}
spring.config.import=optional:file:.env[.properties]

# Database
spring.jpa.hibernate.ddl-auto=none
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.properties.hibernate.jdbc.batch_size=100
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
spring.jpa.properties.hibernate.jdbc.batch_versioned_data=true
spring.jpa.open-in-view=false
spring.jpa.show-sql: false

# Connection Pool
spring.datasource.hikari.pool-name=BandSyncPool
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.idle-timeout=120000
spring.datasource.hikari.max-lifetime=600000
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.leak-detection-threshold=20000

# Compression
server.compression.enabled=true
server.compression.mime-types=application/json,text/html,text/xml,text/plain,text/css,text/javascript
server.compression.min-response-size=1024

# Tomcat
server.tomcat.threads.max=150
server.tomcat.accept-count=100
server.tomcat.max-connections=5000
server.tomcat.connection-timeout=20s

# Cache
spring.cache.type=caffeine

#JWT secret key
secret.key.jwt=${SECRET_KEY_JWT}

# AWS
aws.access.key=${AWS_ACCESS_KEY_ID}
aws.secret.key=${AWS_SECRET_ACCESS_KEY}
aws.region=${AWS_REGION}
aws.bucket.name=${AWS_BUCKET_NAME}
aws.bucket.users.directory=${AWS_BUCKET_USERS_DIRECTORY}
aws.bucket.logos.directory=${AWS_BUCKET_LOGOS_DIRECTORY}
aws.bucket.songs.directory=${AWS_BUCKET_SONGS_DIRECTORY}

# Multipart configuration
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Email configuration
spring.mail.host=${MAIL_HOST}
spring.mail.port=${MAIL_PORT}
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=${MAIL_AUTH}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_STARTTLS_ENABLE}

# Fronted
fronted.url=${WEB_SITE_URL}
fronted.musicalband.path=${WEB_SITE_MUSICALBANDS_PATH}

# Two factor authentication
app.master-secret-key=${MASTER_SECRET_KEY}

# Default musical genres
default.musical-genres=${DEFAULT_MUSICAL_GENRES}

# Default musical roles
default.musical-roles=${DEFAULT_MUSICAL_ROLES}

# Cors
app.cors.allowed-origins=${ALLOWED_ORIGINS}

# Actuator
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=never
management.metrics.tags.application=${APP_NAME}

# Logs
logging.level.root=INFO
logging.level.org.springframework.web=WARN
logging.level.org.hibernate=WARN

# Async
spring.task.execution.pool.core-size=5
spring.task.execution.pool.max-size=20
spring.task.execution.pool.queue-capacity=100
spring.task.execution.thread-name-prefix=bandsync-